name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # api 的測試用 Testcontainers 啟動 Postgres（runner 內建 Docker），
      # Temporal TestWorkflowEnvironment 會自動下載 test server。
      - run: bun run test
      - run: bun run build
