# 本機開發用的依賴服務與反向代理。apps 在本機用 `bun run dev` 執行（Node.js 24）。
#
#   docker compose -f deploy/compose.yaml up -d
#
# 瀏覽器開 http://localhost:8000（Caddy：/api → api、其餘 → web）。
name: river

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: river
      POSTGRES_PASSWORD: river
      # 應用程式的 database；Temporal 的 database 由 temporal 服務自行建立。
      POSTGRES_DB: river
    ports:
      - "${RIVER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U river -d river"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: river
      POSTGRES_PWD: river
      POSTGRES_SEEDS: postgres
      # 持久層與 visibility 各需要一個 database（兩者的 schema_version 表會衝突），都與 river 分開。
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 | grep -q SERVING"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.54.1
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    # 只開放給本機；正式環境只開放給內網或 VPN。
    ports:
      - "127.0.0.1:8080:8080"

  garage:
    image: dxflrs/garage:v2.4.1
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "3900:3900" # S3 API
      - "127.0.0.1:3903:3903" # admin API

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      SITE_ADDRESS: ${RIVER_SITE_ADDRESS:-:8000}
      API_UPSTREAM: ${RIVER_API_UPSTREAM:-host.docker.internal:3000}
      WEB_UPSTREAM: ${RIVER_WEB_UPSTREAM:-host.docker.internal:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  caddy-data:
