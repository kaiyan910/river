<!doctype html>
<!--
  PROTOTYPE — throwaway. 不是 production code。

  問題：River 整體的 design token（顏色、字體、圓角、密度）應該長什麼樣？
        套在「登入 → TOTP → 登入後首頁 scaffold」上看起來如何？

  三個方向，用 ?variant=A|B|C|D|E 切換（底部浮動列或鍵盤 ← →）：
    A 清流    — 中性藍灰、分割式登入、左側 sidebar + KPI + 表格
    B 公文    — 紙張與朱印、信頭式登入、上方分頁 + 單欄待辦收件匣
    C 控制台  — 色彩只代表狀態、icon rail + 清單 + 詳情三欄
    D 混搭 · A token — 登入 / TOTP 用 A 版面、首頁用 C 版面，套 A 的 token
    E 混搭 · C token — 同上版面，套 C 的 token

  假設：apps/web 還沒建立（issue 01 walking skeleton 尚未開工），所以做成單一 HTML，
        直接用瀏覽器開啟即可。Token 命名沿用 shadcn/ui（Tailwind v4）的 CSS 變數，
        Tokens 面板的「複製 CSS」可以直接貼進之後的 globals.css。
  其他 URL 參數：screen=login|totp|dashboard、theme=light|dark、persona=participant|designer|admin
-->
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River Token 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ───────────── 共用 primitives（只吃 token） ───────────── */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-base);line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}
h1,h2,h3{font-family:var(--font-heading);margin:0;line-height:1.25;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
p{margin:0}
.muted{color:var(--muted-foreground)}
.small{font-size:.86em}
.mono{font-family:var(--font-mono);font-size:.92em}
.link{color:var(--primary);text-decoration:none;cursor:pointer}
.link:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

.field{display:grid;gap:.4em;margin-bottom:1.1em}
.label{font-size:.9em;font-weight:500}
.label-row{display:flex;justify-content:space-between;align-items:baseline}
.input{width:100%;height:2.6em;padding:0 .8em;border:1px solid var(--input);border-radius:var(--radius);background:var(--card);color:var(--foreground);transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--muted-foreground);opacity:.8}
.input:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 28%,transparent)}
.otp{font-family:var(--font-mono);font-size:1.4em;letter-spacing:.6em;text-align:center;height:2.4em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;height:2.5em;padding:0 1em;border-radius:var(--radius);border:1px solid transparent;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:color-mix(in oklch,var(--primary) 88%,var(--foreground))}
.btn-outline{background:var(--card);border-color:var(--border);color:var(--foreground)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{background:transparent;color:var(--muted-foreground)}
.btn-ghost:hover{background:var(--accent);color:var(--accent-foreground)}
.btn-block{width:100%}
.btn-sm{height:2.1em;padding:0 .75em;font-size:.9em}
.btn-icon{display:inline-grid;place-items:center;width:2.4em;height:2.4em;border-radius:var(--radius);border:0;background:transparent;color:var(--muted-foreground);cursor:pointer}
.btn-icon:hover{background:var(--accent);color:var(--accent-foreground)}

.badge{display:inline-flex;align-items:center;gap:.4em;font-size:.8em;font-weight:500;padding:.15em .6em;border-radius:999px;color:var(--s);background:color-mix(in oklch,var(--s) 13%,transparent);white-space:nowrap}
.badge::before{content:"";width:.5em;height:.5em;border-radius:9px;background:currentColor}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px)}
.avatar{width:2.2em;height:2.2em;flex:none;border-radius:999px;display:grid;place-items:center;background:var(--accent);color:var(--accent-foreground);font-weight:600;font-size:.9em}
.kbd{font-family:var(--font-mono);font-size:.72em;padding:.05em .4em;border:1px solid currentColor;border-radius:4px;opacity:.55}

.ph{display:grid;place-items:center;text-align:center;gap:.6em;padding:64px 16px;min-height:50vh}
.ph-icon{width:56px;height:56px;border-radius:calc(var(--radius) + 6px);display:grid;place-items:center;background:var(--muted);color:var(--muted-foreground)}
.ph h2{font-size:1.3em}
.ph p{max-width:36em}

/* ───────────── A 清流 ───────────── */
.a-auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.a-auth-brand{position:relative;overflow:hidden;background:var(--brand);color:var(--brand-foreground);padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.a-auth-brand h2{font-size:2em;font-weight:600;letter-spacing:-.02em;margin-bottom:1em}
.a-auth-brand ul{list-style:none;margin:0;padding:0;display:grid;gap:.8em;opacity:.92}
.a-auth-brand li{display:flex;align-items:center;gap:.6em}
.a-auth-waves{position:absolute;left:-10%;right:-10%;bottom:-20px;opacity:.13;pointer-events:none}
.a-auth-foot{opacity:.65;font-size:.86em;position:relative}
.a-logo{display:flex;align-items:center;gap:.5em;font-weight:700;font-size:1.1em;position:relative}
.a-auth-main{display:grid;place-items:center;padding:32px 16px 110px}
.a-auth-form{width:100%;max-width:360px}
.a-auth-form h1{font-size:1.7em;font-weight:600;margin-bottom:.3em}
.a-auth-form .lede{margin-bottom:1.8em}
.a-auth-form .fine{margin-top:1.4em}
.a-mlogo{display:none;margin-bottom:28px;color:var(--primary)}

.a-shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.a-side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;background:var(--sidebar);color:var(--sidebar-foreground);border-right:1px solid var(--sidebar-border)}
.a-side .a-logo{padding:4px 10px 20px}
.a-side .a-logo svg{color:var(--primary)}
.a-side nav{flex:1;overflow:auto}
.a-nav-group{margin-bottom:18px}
.a-nav-label{font-size:.74em;font-weight:600;letter-spacing:.05em;color:var(--muted-foreground);padding:0 10px 6px}
.a-nav-item{display:flex;align-items:center;gap:.65em;width:100%;height:36px;padding:0 10px;border:0;border-radius:var(--radius);background:transparent;color:var(--sidebar-foreground);text-align:left;cursor:pointer}
.a-nav-item svg{color:var(--muted-foreground)}
.a-nav-item:hover{background:var(--sidebar-accent)}
.a-nav-item.is-active{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-weight:600}
.a-nav-item.is-active svg{color:var(--primary)}
.a-nav-badge{margin-left:auto;min-width:1.7em;padding:0 .45em;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:.74em;text-align:center;line-height:1.7}
.a-user{display:flex;align-items:center;gap:.6em;padding:12px 8px 4px;border-top:1px solid var(--sidebar-border)}
.a-user-name{font-weight:600;font-size:.92em;line-height:1.3}
.a-user .btn-icon{margin-left:auto}
.a-main{min-width:0;display:flex;flex-direction:column}
.a-top{position:sticky;top:0;z-index:5;height:60px;display:flex;align-items:center;gap:10px;padding:0 24px;background:color-mix(in oklch,var(--background) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.a-search{position:relative;flex:1;max-width:420px}
.a-search svg{position:absolute;left:.75em;top:50%;transform:translateY(-50%);color:var(--muted-foreground)}
.a-search .input{padding-left:2.4em;background:var(--secondary);border-color:transparent}
.a-top-gap{flex:1}
.a-mobile-only{display:none}
.a-content{width:100%;max-width:1200px;padding:28px 24px 110px}
.a-greet h1{font-size:1.6em;font-weight:600}
.a-greet p{margin-top:.25em}
.a-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}
.a-kpi{padding:16px}
.a-kpi-label{font-size:.86em;color:var(--muted-foreground)}
.a-kpi-val{font-family:var(--font-heading);font-size:1.9em;font-weight:600;margin-top:.15em;font-variant-numeric:tabular-nums}
.a-kpi.is-warn .a-kpi-val{color:var(--status-overdue)}
.a-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.a-card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.a-card-head h2{font-size:1em;font-weight:600}
.a-scroll{overflow-x:auto}
.a-table{width:100%;border-collapse:collapse}
.a-table th{text-align:left;font-weight:500;font-size:.8em;color:var(--muted-foreground);padding:8px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
.a-table td{padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
.a-table tr:last-child td{border-bottom:0}
.a-table tbody tr{cursor:pointer}
.a-table tbody tr:hover{background:var(--muted)}
.a-cell-title{font-weight:500;white-space:normal}
.a-num{font-variant-numeric:tabular-nums;text-align:right}
.a-reqs{list-style:none;margin:0;padding:0}
.a-reqs li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.a-reqs li:last-child{border-bottom:0}
.a-reqs .t{font-weight:500}
@media (max-width:1000px){.a-grid{grid-template-columns:minmax(0,1fr)}.a-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.a-auth{grid-template-columns:minmax(0,1fr)}.a-auth-brand{display:none}.a-mlogo{display:flex}}
@media (max-width:760px){.a-shell{grid-template-columns:minmax(0,1fr)}.a-side{display:none}.a-top{padding:0 16px}.a-mobile-only{display:inline-grid}.a-top .btn-primary span{display:none}.a-content{padding:20px 16px 130px}}

/* ───────────── B 公文 ───────────── */
[data-variant="B"] .input{border:0;border-bottom:1px solid color-mix(in oklch,var(--foreground) 55%,transparent);border-radius:0;background:transparent;padding:0 2px}
[data-variant="B"] .input:focus{border-bottom-color:var(--primary);box-shadow:0 1px 0 var(--primary)}
[data-variant="B"] .btn-primary.btn-block{letter-spacing:.35em;height:2.8em}
.b-auth{min-height:100vh;display:grid;place-items:center;padding:40px 16px 120px;background-image:linear-gradient(transparent calc(100% - 1px),color-mix(in oklch,var(--border) 55%,transparent) 0);background-size:100% 34px}
.b-letter{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-top:4px double var(--primary);padding:36px 40px 28px;box-shadow:0 24px 48px -28px color-mix(in oklch,var(--foreground) 35%,transparent)}
.b-letter-head{display:flex;align-items:center;gap:14px;padding-bottom:20px;margin-bottom:26px;border-bottom:1px solid var(--border)}
.b-seal{width:46px;height:46px;flex:none;display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground);font-family:var(--font-heading);font-weight:900;font-size:24px;border-radius:var(--radius);box-shadow:inset 0 0 0 3px var(--primary),inset 0 0 0 4.5px var(--primary-foreground)}
.b-seal.sm{width:32px;height:32px;font-size:17px;box-shadow:inset 0 0 0 2px var(--primary),inset 0 0 0 3px var(--primary-foreground)}
.b-title{font-family:var(--font-heading);font-size:1.35em;font-weight:700;line-height:1.2}
.b-sub{font-size:.8em;letter-spacing:.14em;color:var(--muted-foreground)}
.b-letter h1{font-size:1.2em;font-weight:700;margin-bottom:.35em}
.b-letter .lede{margin-bottom:1.6em;font-size:.93em}
.b-letter-foot{margin-top:24px;padding-top:14px;border-top:1px dashed var(--border);font-family:var(--font-heading);font-size:.82em;color:var(--muted-foreground)}

.b-head{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--border)}
.b-head-inner{max-width:1040px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:24px}
.b-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-heading);font-weight:700;font-size:1.15em}
.b-tabs{flex:1;display:flex;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none}
.b-tab{display:flex;align-items:center;gap:.4em;height:100%;padding:0 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted-foreground);white-space:nowrap;cursor:pointer}
.b-tab:hover{color:var(--foreground)}
.b-tab.is-active{color:var(--foreground);border-bottom-color:var(--primary);font-weight:700}
.b-count{font-size:.78em;font-weight:700;color:var(--primary)}
.b-head-right{display:flex;align-items:center;gap:12px}
.b-user{display:flex;flex-direction:column;text-align:right;line-height:1.25;font-size:.9em}
.b-user span{font-size:.8em;color:var(--muted-foreground)}
.b-content{max-width:880px;margin:0 auto;padding:40px 24px 120px}
.b-date{font-family:var(--font-heading);letter-spacing:.12em;font-size:.88em;color:var(--muted-foreground);margin-bottom:.4em}
.b-h1{font-size:2em;font-weight:700;margin-bottom:22px}
.b-h1 em{font-style:normal;color:var(--primary)}
.b-inbox{list-style:none;margin:0 0 52px;padding:0;border-top:2px solid var(--foreground)}
.b-doc{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--border)}
.b-doc.is-overdue{box-shadow:inset 3px 0 0 var(--status-overdue);padding-left:14px}
.b-doc-kind{font-family:var(--font-heading);font-weight:700;color:var(--primary);white-space:nowrap}
.b-doc-title{font-weight:600;font-size:1.05em}
.b-doc-meta{font-size:.86em;color:var(--muted-foreground);margin-top:.2em}
.b-doc-side{display:flex;align-items:center;gap:12px}
.b-flag{font-family:var(--font-heading);font-size:.75em;font-weight:700;letter-spacing:.12em;color:var(--status-overdue);border:1px solid currentColor;padding:0 .35em}
.b-h2{display:flex;align-items:baseline;gap:12px;font-size:1.25em;font-weight:700;margin-bottom:12px}
.b-h2 small{font-family:var(--font-sans);font-weight:400;font-size:.65em;color:var(--muted-foreground)}
.b-ledger{width:100%;border-collapse:collapse;border-top:2px solid var(--foreground)}
.b-ledger th{font-family:var(--font-heading);font-weight:700;font-size:.85em;text-align:left;padding:10px 8px;border-bottom:1px solid var(--foreground);white-space:nowrap}
.b-ledger td{padding:12px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.b-ledger td:last-child,.b-ledger th:last-child{text-align:center;width:5em}
.b-stamp{display:inline-grid;place-items:center;width:3.3em;height:3.3em;border-radius:999px;border:2px solid var(--s);color:var(--s);font-family:var(--font-heading);font-weight:900;font-size:.82em;letter-spacing:.05em;transform:rotate(-12deg);box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px var(--s);opacity:.92}
@media (max-width:760px){
  .b-head-inner{height:auto;flex-wrap:wrap;padding:10px 16px 0;gap:10px}
  .b-head-right{margin-left:auto}
  .b-user{display:none}
  .b-tabs{order:3;flex-basis:100%;height:44px}
  .b-content{padding:24px 16px 130px}
  .b-doc{grid-template-columns:1fr;gap:6px}
  .b-doc-side{justify-content:space-between}
  .b-ledger th:nth-child(1),.b-ledger td:nth-child(1),.b-ledger th:nth-child(4),.b-ledger td:nth-child(4){display:none}
  .b-letter{padding:28px 20px 22px}
}

/* ───────────── C 控制台 ───────────── */
.c-auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c-auth-main{display:flex;flex-direction:column;justify-content:space-between;gap:48px;padding:40px 8vw 110px}
.c-auth-top{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:.85em;color:var(--muted-foreground)}
.c-auth-top svg{color:var(--foreground)}
.c-auth-form{width:100%;max-width:340px}
.c-auth-form h1{font-size:2.4em;font-weight:600;letter-spacing:-.035em;margin-bottom:.15em}
.c-auth-form .lede{margin-bottom:1.8em}
.c-auth-foot{font-family:var(--font-mono);font-size:.78em;color:var(--muted-foreground)}
.c-auth-art{display:grid;place-items:center;padding:32px;overflow:hidden;background-color:var(--sidebar);background-image:radial-gradient(color-mix(in oklch,var(--sidebar-foreground) 22%,transparent) 1px,transparent 1px);background-size:20px 20px;border-left:1px solid var(--sidebar-border)}
.c-auth-art svg{width:100%;max-width:440px;height:auto}
.c-auth-art text{font-family:var(--font-mono);font-size:12px;fill:var(--sidebar-foreground)}
.c-pulse{animation:c-pulse 1.8s ease-in-out infinite}
@keyframes c-pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.c-pulse{animation:none}}
.c-otp{display:flex;gap:8px;margin-bottom:1.3em}
.c-otp .input{width:2.7em;height:3.1em;padding:0;text-align:center;font-family:var(--font-mono);font-size:1.2em}
.c-otp .input:nth-child(3){margin-right:10px}

.c-shell{display:grid;grid-template-columns:56px 360px minmax(0,1fr);height:100vh}
.c-rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;background:var(--sidebar);color:var(--sidebar-foreground);border-right:1px solid var(--sidebar-border)}
.c-rail-logo{color:var(--sidebar-primary);margin-bottom:12px;display:grid;place-items:center;height:38px}
.c-rail-btn{position:relative;flex:none;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:var(--radius);background:transparent;color:var(--sidebar-foreground);cursor:pointer}
.c-rail-btn:hover,.c-rail-btn.is-active{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.c-rail-btn.is-active::before{content:"";position:absolute;left:-9px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--sidebar-primary)}
.c-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:9px;background:var(--status-overdue)}
.c-rail-sep{flex:none;width:22px;height:1px;margin:6px 0;background:var(--sidebar-border)}
.c-rail-spacer{flex:1}
.c-avatar{flex:none;width:30px;height:30px;margin-top:6px;border-radius:999px;display:grid;place-items:center;background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-size:.8em;font-weight:600}
.c-list{display:flex;flex-direction:column;min-height:0;background:var(--card);border-right:1px solid var(--border)}
.c-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px}
.c-seg{display:inline-flex;padding:2px;border-radius:var(--radius);background:var(--muted)}
.c-seg button{padding:.3em .7em;border:0;border-radius:calc(var(--radius) - 2px);background:transparent;color:var(--muted-foreground);font-size:.93em;cursor:pointer}
.c-seg button.is-active{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px color-mix(in oklch,var(--foreground) 14%,transparent)}
.c-seg span{margin-left:.35em;font-family:var(--font-mono);font-size:.85em;opacity:.7}
.c-search{position:relative;margin:0 12px 10px}
.c-search svg{position:absolute;left:.7em;top:50%;transform:translateY(-50%);color:var(--muted-foreground)}
.c-search .kbd{position:absolute;right:.7em;top:50%;transform:translateY(-50%)}
.c-search .input{height:2.3em;padding-left:2.2em;background:var(--muted);border-color:transparent}
.c-rows{flex:1;overflow:auto;border-top:1px solid var(--border)}
.c-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:calc(var(--row-h) + 18px);padding:8px 12px;border:0;border-left:2px solid transparent;border-bottom:1px solid var(--border);background:transparent;text-align:left;cursor:pointer}
.c-row:hover{background:var(--accent)}
.c-row.is-sel{background:var(--accent);border-left-color:var(--foreground)}
.c-row-dot{width:8px;height:8px;border-radius:9px;background:var(--s)}
.c-row-main{display:flex;flex-direction:column;min-width:0}
.c-row-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-row-meta{font-family:var(--font-mono);font-size:.8em;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-row-age{font-family:var(--font-mono);font-size:.78em;color:var(--muted-foreground);white-space:nowrap}
.c-detail{min-width:0;overflow:auto}
.c-detail-body{max-width:780px;padding:22px 32px 110px}
.c-detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.c-crumb{display:flex;align-items:center;gap:.6em;font-family:var(--font-mono);font-size:.82em;color:var(--muted-foreground)}
.c-detail h1{font-size:1.6em;font-weight:600;letter-spacing:-.02em;margin:.35em 0 0}
.c-actions{display:flex;gap:8px;align-items:center}
.c-dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:22px 0 28px;border:1px solid var(--border);border-radius:var(--radius);background:var(--border);overflow:hidden}
.c-dl div{background:var(--card);padding:10px 12px;min-width:0}
.c-dl dt{font-size:.78em;color:var(--muted-foreground)}
.c-dl dd{margin:.15em 0 0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-h3{font-size:.8em;font-weight:600;letter-spacing:.06em;color:var(--muted-foreground);margin-bottom:12px}
.c-tl{list-style:none;margin:0;padding:0}
.c-tl li{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding-bottom:18px}
.c-tl li::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:1px;background:var(--border)}
.c-tl li:last-child::before{display:none}
.c-tl-dot{width:9px;height:9px;margin:6px 0 0 4px;border-radius:9px;background:var(--s)}
.c-tl li.is-current .c-tl-dot{box-shadow:0 0 0 4px color-mix(in oklch,var(--s) 25%,transparent)}
.c-tl li.is-current .c-tl-what{font-weight:600}
.c-tl-when{font-family:var(--font-mono);font-size:.8em;color:var(--muted-foreground);white-space:nowrap}
.c-ph{grid-column:2/-1;overflow:auto}
@media (max-width:1100px){.c-shell{grid-template-columns:56px 300px minmax(0,1fr)}.c-dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.c-auth{grid-template-columns:minmax(0,1fr)}.c-auth-art{display:none}.c-auth-main{padding:32px 16px 120px}}
@media (max-width:760px){
  .c-shell{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh}
  .c-rail{flex-direction:row;padding:6px 8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--sidebar-border);position:sticky;top:0;z-index:5}
  .c-rail-logo{margin:0 6px 0 2px}
  .c-rail-btn.is-active::before,.c-rail-sep{display:none}
  .c-avatar{margin:0 0 0 4px}
  .c-list{border-right:0}
  .c-rows{max-height:45vh}
  .c-detail-body{padding:20px 16px 130px}
  .c-ph{grid-column:auto}
}

/* ───────────── Prototype chrome（刻意不吃 token） ───────────── */
.pt-bar{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:14px;z-index:1000;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;max-width:calc(100vw - 16px);padding:6px 8px;border-radius:20px;background:#0b0b0c;color:#f4f4f5;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.1);font:500 12.5px/1 ui-sans-serif,system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.pt-bar button{all:unset;box-sizing:border-box;height:28px;padding:0 10px;display:inline-flex;align-items:center;gap:4px;border-radius:999px;color:#f4f4f5;cursor:pointer}
.pt-bar button:hover{background:rgba(255,255,255,.12)}
.pt-bar button:focus-visible,.pt-bar select:focus-visible{outline:2px solid #7dd3fc}
.pt-bar .pt-arrow{width:28px;padding:0;justify-content:center;font-size:16px}
.pt-tag{padding:0 4px 0 8px;font-size:10px;font-weight:700;letter-spacing:.14em;color:#fbbf24}
.pt-label{min-width:118px;padding:0 4px;text-align:center;white-space:nowrap}
.pt-label b{color:#fff}
.pt-sep{width:1px;height:18px;background:rgba(255,255,255,.16)}
.pt-seg{display:inline-flex;padding:2px;border-radius:999px;background:rgba(255,255,255,.08)}
.pt-seg button{height:24px}
.pt-seg button.on{background:#f4f4f5;color:#0b0b0c}
.pt-bar select{height:28px;padding:0 8px;border:0;border-radius:999px;background:#232326;color:#f4f4f5;font:inherit;cursor:pointer}
.pt-panel{position:fixed;top:0;right:0;bottom:0;z-index:999;width:min(400px,100vw);overflow:auto;padding:16px 16px 110px;background:#0f0f10;color:#e4e4e7;visibility:hidden;transform:translateX(102%);transition:transform .2s ease,visibility .2s;font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.pt-panel.open{transform:none;visibility:visible;box-shadow:-20px 0 40px rgba(0,0,0,.3)}
.pt-panel header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pt-panel h3{margin:0;font-size:15px;color:#fff;font-family:inherit;letter-spacing:0}
.pt-panel h4{margin:22px 0 8px;font-size:11px;font-weight:600;letter-spacing:.12em;color:#9ca3af}
.pt-panel p{margin:8px 0 0;color:#a1a1aa}
.pt-panel pre{margin:0;padding:10px;border-radius:8px;background:#1a1a1d;font:12px/1.45 ui-monospace,Menlo,monospace;overflow:auto;color:#e4e4e7}
.pt-panel .pt-x,.pt-panel .pt-btn{all:unset;cursor:pointer;padding:6px 10px;border-radius:8px;background:#232326;color:#f4f4f5}
.pt-panel .pt-btn{display:block;text-align:center;margin-top:12px}
.pt-panel .pt-x:hover,.pt-panel .pt-btn:hover{background:#2e2e33}
.pt-swatches{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.pt-sw{display:grid;grid-template-columns:26px minmax(0,1fr);gap:0 8px;align-items:center;min-width:0}
.pt-sw span{grid-row:span 2;width:26px;height:26px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.pt-sw code{font:11.5px ui-monospace,Menlo,monospace;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-sw small{font:10.5px ui-monospace,Menlo,monospace;color:#8b8b93;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-specimen{padding:14px;border-radius:8px;background:var(--background);color:var(--foreground);display:grid;gap:10px}
.pt-specimen .row{display:flex;align-items:baseline;gap:10px}
.pt-specimen .row small{font:10.5px ui-monospace,Menlo,monospace;color:var(--muted-foreground);width:64px;flex:none}
.pt-radius{display:flex;gap:10px;align-items:end}
.pt-radius div{width:52px;height:40px;background:var(--primary);display:grid;place-items:center;color:var(--primary-foreground);font:10.5px ui-monospace,Menlo,monospace}
.pt-toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:1001;padding:8px 14px;border-radius:999px;background:#0b0b0c;color:#f4f4f5;font:12.5px ui-sans-serif,system-ui,"PingFang TC",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none}
.pt-toast.show{opacity:1}
</style>

  return `<section class="c-list">
      <div class="c-list-head">
        <div class="c-seg" role="tablist"><button class="${state.cTab === 'tasks' ? 'is-active' : ''}" data-ctab="tasks">待辦<span>${TASKS.length}</span></button><button class="${state.cTab === 'requests' ? 'is-active' : ''}" data-ctab="requests">我的申請<span>${REQUESTS.length}</span></button></div>
        <button class="btn btn-primary btn-sm" data-nav="start">${icon('plus', 14)} 發起</button>
      </div>
      <div class="c-search">${icon('search', 15)}<input class="input" placeholder="搜尋編號、標題、發起人"><span class="kbd">/</span></div>
      <div class="c-rows">${rows}</div>
    </section>
    <section class="c-detail"><div class="c-detail-body">
      <div class="c-detail-top">
        <div><div class="c-crumb"><span>${sel.id}</span>${badge(sel.status)}</div><h1>${sel.title}</h1></div>
        <div class="c-actions">${actions}</div>
      </div>
      <dl class="c-dl">${dl.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
      <h3 class="c-h3">歷程</h3>
      <ol class="c-tl">${sel.events.map(([what, who, when, tok, cur]) => `<li class="${cur ? 'is-current' : ''}"><span class="c-tl-dot" style="--s:var(--status-${tok})"></span><div><div class="c-tl-what">${what}</div><div class="muted small">${who}</div></div><span class="c-tl-when">${when}</span></li>`).join('')}</ol>
    </div></section>`;
}

const VIEWS = { A, B, C, D: { login: A.login, totp: A.totp, dashboard: C.dashboard }, E: { login: A.login, totp: A.totp, dashboard: C.dashboard } };

// ───────────── Prototype chrome ─────────────
const KEYS = Object.keys(TOKENS);
function applyTokens() {
  const v = TOKENS[state.variant], root = document.documentElement;
  for (const [k, val] of Object.entries(full(v[state.theme]))) root.style.setProperty('--' + k, val);
  root.style.setProperty('--radius', v.radius);
  root.style.setProperty('--font-sans', v.fonts.sans);
  root.style.setProperty('--font-heading', v.fonts.heading);
  root.style.setProperty('--font-mono', v.fonts.mono);
  root.style.setProperty('--text-base', v.textBase);
  root.style.setProperty('--row-h', v.rowH);
  root.dataset.variant = state.variant;
  root.dataset.theme = state.theme;
  root.style.colorScheme = state.theme;
}
function cssFor(key) {
  const v = TOKENS[key];
  const block = c => Object.entries(full(c)).map(([k, val]) => `  --${k}: ${val};`).join('\n');
  return `/* River design tokens — variant ${key}「${v.name}」（prototype 匯出） */\n:root {\n  --radius: ${v.radius};\n  --font-sans: ${v.fonts.sans};\n  --font-heading: ${v.fonts.heading};\n  --font-mono: ${v.fonts.mono};\n  --text-base: ${v.textBase};\n  --row-h: ${v.rowH};\n${block(v.light)}\n}\n\n.dark {\n${block(v.dark)}\n}\n`;
}
function renderBar() {
  const v = TOKENS[state.variant];
  const scr = [['login', '登入'], ['totp', 'TOTP'], ['dashboard', '首頁']];
  document.getElementById('pt-bar').innerHTML = `<div class="pt-bar" role="toolbar" aria-label="Prototype 切換列">
    <span class="pt-tag">PROTOTYPE</span>
    <button class="pt-arrow" data-pt="prev" aria-label="上一個 variant">‹</button>
    <span class="pt-label"><b>${state.variant}</b> · ${v.name}</span>
    <button class="pt-arrow" data-pt="next" aria-label="下一個 variant">›</button>
    <span class="pt-sep"></span>
    <div class="pt-seg">${scr.map(([k, l]) => `<button class="${state.screen === k ? 'on' : ''}" data-screen="${k}">${l}</button>`).join('')}</div>
    <select data-pt="persona" aria-label="登入身分">${Object.entries(PERSONAS).map(([k, p]) => `<option value="${k}" ${state.persona === k ? 'selected' : ''}>${p.label}</option>`).join('')}</select>
    <button data-pt="theme" aria-label="切換深淺色">${state.theme === 'dark' ? '☾ Dark' : '☀ Light'}</button>
    <button data-pt="panel">Tokens</button>
  </div>`;
}
function renderPanel() {
  const v = TOKENS[state.variant], colors = full(v[state.theme]);
  const view = { variant: `${state.variant} ${v.name}`, screen: state.screen, theme: state.theme, persona: state.persona,
    permissions: me().perms, totpRequired: needsTotp(), route: state.screen === 'dashboard' ? ROUTES[state.nav] : state.screen === 'totp' ? '/login/totp' : '/login' };
  const scale = [['0.8em', 'xs'], ['0.9em', 'sm'], ['1em', 'base'], ['1.25em', 'lg'], ['1.6em', 'xl'], ['2.2em', '2xl']];
  const p = document.getElementById('pt-panel');
  p.classList.toggle('open', state.panel);
  p.innerHTML = `<header><h3>Tokens · ${state.variant}「${v.name}」</h3><button class="pt-x" data-pt="panel" aria-label="關閉">✕</button></header>
    <p>${v.desc}</p>
    <h4>State</h4><pre>${JSON.stringify(view, null, 2)}</pre>
    <h4>Colors · ${state.theme}</h4>
    <div class="pt-swatches">${Object.entries(colors).map(([k, val]) => `<div class="pt-sw"><span style="background:${val}"></span><code>--${k}</code><small>${val.replace('oklch', '')}</small></div>`).join('')}</div>
    <h4>Type · base ${v.textBase}</h4>
    <div class="pt-specimen" style="font-size:var(--text-base)">
      ${scale.map(([s, n]) => `<div class="row"><small>${n}</small><span style="font-size:${s};font-family:${n.includes('xl') ? 'var(--font-heading)' : 'var(--font-sans)'};font-weight:${n.includes('xl') ? 600 : 400}">審批流程 Request 1,234</span></div>`).join('')}
      <div class="row"><small>mono</small><span style="font-family:var(--font-mono)">R-2026-0412 · NT$ 12,400</span></div>
    </div>
    <h4>Radius · row height</h4>
    <div class="pt-radius"><div style="border-radius:calc(var(--radius) - 2px)">sm</div><div style="border-radius:var(--radius)">${v.radius}</div><div style="border-radius:calc(var(--radius) + 4px)">lg</div><div style="height:${v.rowH};border-radius:0;width:auto;padding:0 8px">row ${v.rowH}</div></div>
    <button class="pt-btn" data-pt="copy">複製 CSS（shadcn globals.css 格式）</button>`;
}
function render() { document.getElementById('app').innerHTML = VIEWS[state.variant][state.screen](); }
function updateURL() {
  const u = new URL(location.href);
  for (const k of ['variant', 'screen', 'theme', 'persona']) u.searchParams.set(k, state[k]);
  history.replaceState(null, '', u);
}
function sync() { applyTokens(); render(); renderBar(); renderPanel(); updateURL(); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('pt-toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}
const cycle = d => setState({ variant: KEYS[(KEYS.indexOf(state.variant) + d + KEYS.length) % KEYS.length] });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-noop],[data-nav],[data-logout],[data-screen],[data-sel],[data-ctab],[data-pt]');
  if (!t || t.tagName === 'SELECT') return;
  e.preventDefault();
  const d = t.dataset;
  if (d.noop !== undefined) return toast('Prototype：這個動作沒有接上');
  if (d.nav) return setState({ nav: d.nav, screen: 'dashboard', ...(d.nav === 'tasks' || d.nav === 'requests' ? { cTab: d.nav } : {}) });
  if (d.logout !== undefined) return setState({ screen: 'login', nav: 'home' });
  if (d.screen) return setState({ screen: d.screen });
  if (d.sel) return setState({ sel: d.sel });
  if (d.ctab) return setState({ cTab: d.ctab, sel: (d.ctab === 'tasks' ? TASKS : REQUESTS)[0].id });
  if (d.pt === 'prev') return cycle(-1);
  if (d.pt === 'next') return cycle(1);
  if (d.pt === 'theme') return setState({ theme: state.theme === 'dark' ? 'light' : 'dark' });
  if (d.pt === 'panel') return setState({ panel: !state.panel });
  if (d.pt === 'copy') {
    const css = cssFor(state.variant);
    navigator.clipboard?.writeText(css).then(() => toast('已複製 CSS'), () => { console.log(css); toast('無法存取剪貼簿，CSS 已輸出到 console'); });
  }
});
document.addEventListener('change', e => { if (e.target.dataset.pt === 'persona') setState({ persona: e.target.value }); });
document.addEventListener('submit', e => {
  e.preventDefault();
  const a = e.target.dataset.action;
  if (a === 'login') setState({ screen: needsTotp() ? 'totp' : 'dashboard', nav: 'home' });
  if (a === 'totp') setState({ screen: 'dashboard', nav: 'home' });
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.closest('.c-otp') && el.value) el.nextElementSibling?.focus();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

sync();
</script>
</body>
</html>
